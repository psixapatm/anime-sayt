<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aniduble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1c1c1c;
  --ink: #ffffff;
  --card: #242424;
  --mut: #a3a3a3;
  --acc: #ffffff;
  --acc-inv: #1c1c1c;
  --line: rgba(255, 255, 255, 0.35);
  --line-soft: rgba(255, 255, 255, 0.16);
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 'Nunito Sans', system-ui, sans-serif;
}

h1, h2, h3 {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  margin: 0;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 5vw;
  border-bottom: 1px solid var(--line);
  background: rgba(28, 28, 28, 0.92);
  backdrop-filter: blur(10px);
  flex-wrap: wrap;
}

.logo {
  display: inline-flex;
  flex-direction: column;
  cursor: pointer;
  line-height: 1.1;
}

.logo-main {
  font: 800 24px 'Bricolage Grotesque', sans-serif;
  letter-spacing: -0.4px;
  color: #ffffff;
}

.logo-sub {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #cfcfcf;
  margin-top: 3px;
}

nav {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

nav span {
  color: var(--mut);
  font-weight: 600;
  margin-right: 4px;
}

/* Tugmalar va Inputlar */
button, input, textarea, select {
  font: inherit;
  color: var(--ink);
}

button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: transparent;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: 600;
  transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.12s;
}

button:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: #ffffff;
}

button:active {
  transform: scale(0.97);
}

button.pri {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.55);
  color: #ffffff;
}

button.pri:hover {
  background: #ffffff;
  color: #1c1c1c;
}

button.solid {
  background: #ffffff;
  border-color: #ffffff;
  color: #1c1c1c;
  font-weight: 700;
}

button.solid:hover {
  background: #e5e5e5;
  color: #1c1c1c;
}

button.del {
  color: #ff6b6b;
  border-color: rgba(255, 107, 107, 0.4);
}

button.del:hover {
  background: rgba(255, 107, 107, 0.12);
  border-color: #ff6b6b;
}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
}

main {
  padding: 34px 5vw 70px;
  max-width: 1240px;
  margin: auto;
}

/* Qidiruv va Grid */
.tools {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}

.tools input, .tools select {
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: #ffffff;
}

.tools input {
  flex: 1;
  min-width: 200px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 26px;
}

.item { cursor: pointer; }

.poster {
  position: relative;
  aspect-ratio: 2/3;
  border-radius: 16px;
  background: var(--card) center/cover;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.item:hover .poster, .item:focus-visible .poster {
  transform: translateY(-5px);
  border-color: #ffffff;
}

.ph {
  font: 800 72px 'Bricolage Grotesque', sans-serif;
  color: #ffffff;
  opacity: 0.4;
}

.chip {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(28, 28, 28, 0.85);
  border: 1px solid var(--line);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
}

.item h3 {
  font-size: 17px;
  margin: 12px 0 2px;
  line-height: 1.25;
}

.item small { color: var(--mut); }

.form, .panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  max-width: 540px;
  box-shadow: var(--shadow);
}

.center { margin: 0 auto; }

.form label {
  display: block;
  font-weight: 600;
  margin: 14px 0 6px;
}

.form input, .form textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: #ffffff;
}

.err {
  color: #ff6b6b;
  min-height: 22px;
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
}

/* Anime ichki sahifasi */
.detail {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 34px;
}

.detail h2 {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.1;
}

.player {
  width: 100%;
  aspect-ratio: 16/9;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #000;
  margin-top: 16px;
}

.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 10px;
  flex-wrap: wrap;
}

.empty {
  color: var(--mut);
  padding: 40px 0;
}

.eps {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}

.eps button {
  border-radius: 999px;
  padding: 7px 16px;
}

.eps button.on {
  background: #ffffff;
  border-color: #ffffff;
  color: #1c1c1c;
}

.sec {
  margin-top: 36px;
  max-width: 660px;
}

.cm {
  border-top: 1px solid var(--line-soft);
  padding: 12px 0;
}

.cm small { color: var(--mut); }

/* Bosh sahifa (Skrinshot uslubida) */
.land {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 40px;
  min-height: 58vh;
}

.land h1 {
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 800;
  line-height: 1.03;
  letter-spacing: -1.8px;
}

.land p {
  color: #d4d4d4;
  font-size: 18px;
  max-width: 460px;
  margin: 20px 0 30px;
}

.land .btns {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.land .btns button {
  padding: 14px 30px;
  font-size: 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.5);
}

.fan {
  position: relative;
  height: 420px;
}

.wc {
  position: absolute;
  width: 200px;
  aspect-ratio: 2/3;
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #fff;
  background: #1c1c1c;
  border: 1px solid rgba(255, 255, 255, 0.55);
  overflow: hidden;
  animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.wc .k, .wc b {
  position: relative;
  z-index: 1;
}

.wc .k {
  font-size: 38px;
  font-weight: 800;
  line-height: 1;
}

.wc b {
  font-weight: 600;
  font-size: 15px;
}

.wc.a { left: 4%; top: 44px; --r: -9deg; transform: rotate(-9deg); }
.wc.b { left: 30%; top: 0; --r: 3deg; transform: rotate(3deg); z-index: 2; animation-delay: 0.12s; }
.wc.c { left: 56%; top: 64px; --r: 11deg; transform: rotate(11deg); animation-delay: 0.24s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(30px) rotate(0); }
  to { opacity: 1; transform: rotate(var(--r)); }
}

.feats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-top: 52px;
  border-top: 1px solid var(--line);
  padding-top: 28px;
}

.feats b {
  display: block;
  font: 700 18px 'Bricolage Grotesque', sans-serif;
  margin-bottom: 6px;
}

.feats span {
  color: #cccccc;
  font-size: 15px;
}

/* Kirish / Ro'yxatdan o'tish oynasi (To'liq ishlaydigan va skrinshot stilida) */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(6px);
  overflow-y: auto;
}

.auth {
  position: relative;
  z-index: 10000;
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  width: min(800px, 100%);
  border-radius: 22px;
  border: 1px solid var(--line);
  overflow: hidden;
  background: #1c1c1c;
  box-shadow: var(--shadow);
  animation: pop 0.2s ease-out;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: none; }
}

.auth-art {
  position: relative;
  background: #151515;
  border-right: 1px solid var(--line-soft);
  color: #fff;
  padding: 40px 34px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 12px;
  min-height: 440px;
  overflow: hidden;
  pointer-events: none;
}

.auth-art p {
  margin: 0;
  color: var(--mut);
  max-width: 260px;
  font-size: 15px;
}

.auth-art::after {
  content: 'アニメ';
  position: absolute;
  top: 20px;
  right: 22px;
  writing-mode: vertical-rl;
  font-size: 74px;
  font-weight: 800;
  opacity: 0.08;
  line-height: 1;
}

.auth-form {
  position: relative;
  z-index: 10001;
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: #1c1c1c;
}

.auth-form h2 {
  font-size: 26px;
  margin-bottom: 4px;
}

.auth-form .sub {
  color: var(--mut);
  margin: 0 0 18px;
  font-size: 15px;
}

.auth-form label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 12px 0 6px;
  color: #e5e5e5;
}

/* Input maydonlari yozish uchun 100% ochiq */
.auth-form input {
  position: relative;
  z-index: 10002;
  pointer-events: auto !important;
  user-select: text !important;
  -webkit-user-select: text !important;
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #141414;
  color: #ffffff !important;
  caret-color: #ffffff;
  min-height: 46px;
  transition: border-color 0.15s, background 0.15s;
}

.auth-form input::placeholder {
  color: #6e6e6e;
}

.auth-form input:focus {
  border-color: #ffffff;
  background: #101010;
  outline: none;
}

.auth-form .go {
  width: 100%;
  margin-top: 16px;
  min-height: 48px;
  font-size: 16px;
}

.m-logo { display: none; }

.tabs {
  display: flex;
  gap: 6px;
  background: #141414;
  border: 1px solid var(--line-soft);
  padding: 5px;
  border-radius: 14px;
  margin-bottom: 22px;
}

.tab {
  flex: 1;
  border: 1px solid transparent;
  background: transparent;
  color: var(--mut);
  padding: 9px;
  border-radius: 10px;
  font-size: 14px;
}

.tab.on {
  background: #262626;
  border-color: var(--line);
  color: #ffffff;
  font-weight: 700;
}

.x {
  position: absolute;
  top: 12px;
  right: 14px;
  z-index: 10003;
  border: 1px solid transparent;
  background: transparent;
  font-size: 24px;
  line-height: 1;
  padding: 4px 10px;
  color: var(--mut);
}

.x:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

/* Telefon moslashuvi */
@media (max-width: 700px) {
  header { padding: 12px 4vw; }
  nav button { padding: 8px 12px; font-size: 14px; }
  main { padding: 22px 4vw 60px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tools { flex-direction: column; }
  .tools > * { width: 100%; min-height: 46px; }
  .detail { grid-template-columns: 1fr; gap: 20px; }
  .detail .poster { max-width: 210px; margin: 0 auto; }
  .land { grid-template-columns: 1fr; gap: 24px; min-height: 0; }
  .land .btns button { flex: 1; }
  .fan { height: 280px; }
  .wc { width: 125px; padding: 12px; border-radius: 16px; }
  .wc .k { font-size: 26px; }
  .feats { grid-template-columns: 1fr; gap: 18px; margin-top: 32px; }
  .auth { grid-template-columns: 1fr; width: min(410px, 100%); }
  .auth-art { display: none; }
  .auth-form { padding: 34px 22px 26px; }
  .m-logo { display: inline-flex; margin-bottom: 14px; cursor: default; }
  .auth-form input { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">
    <span class="logo-main">Aniduble</span>
    <span class="logo-sub">CREATED BY SOBIROV</span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('token');
let me = null;
let list = [];
const filt = { q: '', genre: '', fav: false };

const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {})
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Xatolik yuz berdi');
  return data;
};

const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => {
    if (k !== null && k !== undefined && k !== false) e.append(k);
  });
  return e;
};

const makeLogo = (extraClass = '') =>
  el('div', { className: ('logo ' + extraClass).trim() },
    el('span', { className: 'logo-main', textContent: 'Aniduble' }),
    el('span', { className: 'logo-sub', textContent: 'CREATED BY SOBIROV' })
  );

function setNav() {
  const nav = $('#nav');
  nav.replaceChildren();
  if (me) {
    nav.append(el('span', { textContent: me.username + (me.role === 'admin' ? ' (admin)' : '') }));
    if (me.role === 'admin') {
      nav.append(el('button', { textContent: "Anime qo'shish", onclick: showAdd }));
    }
    nav.append(el('button', { textContent: 'Chiqish', onclick: logout }));
  } else {
    nav.append(el('button', { textContent: 'Kirish', onclick: () => showAuth('login') }));
    nav.append(el('button', { className: 'pri', textContent: "Ro'yxatdan o'tish", onclick: () => showAuth('register') }));
  }
}

function logout() {
  localStorage.removeItem('token');
  token = null;
  me = null;
  setNav();
  showWelcome();
}

function showWelcome() {
  const wc = (cls, kanji, label) =>
    el('div', { className: 'wc ' + cls },
      el('span', { className: 'k', textContent: kanji }),
      el('b', { textContent: label })
    );

  const feat = (t, d) =>
    el('div', {},
      el('b', { textContent: t }),
      el('span', { textContent: d })
    );

  $('#app').replaceChildren(
    el('section', { className: 'land' },
      el('div', {},
        el('h1', { textContent: 'Animeni qulay tomosha qiling' }),
        el('p', { textContent: "Qismlar, sevimlilar va izohlar bir joyda. Boshlash uchun akauntga kiring yoki yangisini oching." }),
        el('div', { className: 'btns' },
          el('button', { className: 'pri', textContent: 'Kirish', onclick: () => showAuth('login') }),
          el('button', { textContent: "Ro'yxatdan o'tish", onclick: () => showAuth('register') })
        )
      ),
      el('div', { className: 'fan' },
        wc('a', '甚', 'Jinta'),
        wc('b', '剣', 'Kenshin'),
        wc('c', '仁', 'Jin')
      )
    ),
    el('div', { className: 'feats' },
      feat("Qism-qism ko'ring", "Har bir serial qismlarga bo'lingan, kerakli qismni tanlaysiz."),
      feat('Sevimlilar', "Yoqqan animelaringizni bir bosishda saqlab qo'ying."),
      feat('Izohlar', "Ko'rganlaringiz haqida fikringizni yozing.")
    )
  );
}

function field(label, name, type = 'text', area = false) {
  const input = area ? el('textarea', { name, rows: 4 }) : el('input', { name, type });
  return el('div', {}, el('label', { textContent: label }), input);
}

function closeAuth() {
  const o = $('#ov');
  if (o) o.remove();
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAuth();
});

function showAuth(mode) {
  closeAuth();
  const reg = mode === 'register';
  const err = el('div', { className: 'err' });

  const u = el('input', {
    type: 'text',
    name: 'username',
    autocomplete: 'username',
    placeholder: 'Loginingizni kiriting'
  });

  const p = el('input', {
    type: 'password',
    name: 'password',
    autocomplete: reg ? 'new-password' : 'current-password',
    placeholder: 'Parolingizni kiriting'
  });

  const submit = async (e) => {
    if (e) e.preventDefault();
    err.textContent = '';
    try {
      const d = await api(reg ? '/api/register' : '/api/login', 'POST', {
        username: u.value.trim(),
        password: p.value
      });
      token = d.token;
      localStorage.setItem('token', token);
      me = await api('/api/me');
      closeAuth();
      setNav();
      showList();
    } catch (ex) {
      err.textContent = ex.message;
    }
  };

  const tab = (m, t) =>
    el('button', {
      type: 'button',
      className: 'tab' + (m === mode ? ' on' : ''),
      textContent: t,
      onclick: () => showAuth(m)
    });

  const formBox = el('form', { className: 'auth-form', onsubmit: submit },
    el('button', { type: 'button', className: 'x', textContent: '×', title: 'Yopish', onclick: closeAuth }),
    makeLogo('m-logo'),
    el('div', { className: 'tabs' }, tab('login', 'Kirish'), tab('register', "Ro'yxatdan o'tish")),
    el('h2', { textContent: reg ? 'Akaunt yaratish' : 'Xush kelibsiz!' }),
    el('p', { className: 'sub', textContent: reg ? "Login va parol o'ylab toping." : 'Login va parolingizni kiriting.' }),
    el('label', { textContent: 'Login' }), u,
    el('label', { textContent: 'Parol' }), p,
    err,
    el('button', { type: 'submit', className: 'solid go', textContent: reg ? "Ro'yxatdan o'tish" : 'Kirish' })
  );

  const ov = el('div', {
    id: 'ov',
    className: 'overlay',
    onmousedown: (e) => { if (e.target === ov) closeAuth(); }
  },
    el('div', { className: 'auth' },
      el('div', { className: 'auth-art' },
        makeLogo(),
        el('p', { textContent: "Sevimli animelaringiz bir joyda. Kiring va yangi qismlarni tomosha qiling." })
      ),
      formBox
    )
  );

  document.body.append(ov);
  document.body.style.overflow = 'hidden';
  setTimeout(() => u.focus(), 30);
}

function showAdd() {
  const err = el('div', { className: 'err' });
  const form = el('div', { className: 'form center' },
    el('h2', { textContent: "Yangi anime qo'shish" }),
    field('Nomi', 'title'),
    field('Janr (vergul bilan: Action, Drama)', 'genre'),
    field('Yil', 'year', 'number'),
    field('Tavsif', 'description', 'text', true),
    field('Poster rasmi havolasi (https://...)', 'poster'),
    field("Video havolasi (ixtiyoriy, qismlarni keyin qo'shasiz)", 'video'),
    err,
    el('button', {
      className: 'solid',
      style: 'margin-top:14px;width:100%',
      textContent: "Qo'shish",
      onclick: async () => {
        const g = (n) => form.querySelector(`[name=${n}]`).value;
        try {
          await api('/api/anime', 'POST', {
            title: g('title'),
            genre: g('genre'),
            year: g('year'),
            description: g('description'),
            poster: g('poster'),
            video: g('video')
          });
          showList();
        } catch (e) {
          err.textContent = e.message;
        }
      }
    })
  );
  $('#app').replaceChildren(form);
}

const poster = (a) => {
  const p = el('div', { className: 'poster' });
  if (a.poster) p.style.backgroundImage = `url("${a.poster.replace(/"/g, '%22')}")`;
  else p.append(el('span', { className: 'ph', textContent: (a.title || '?').trim().charAt(0).toUpperCase() }));
  if (a.year) p.append(el('span', { className: 'chip', textContent: a.year }));
  return p;
};

async function loadList() { list = await api('/api/anime'); }

async function showList() {
  if (!me) return showWelcome();
  try { await loadList(); } catch { return logout(); }
  const genres = [...new Set(list.flatMap(a => (a.genre || '').split(',').map(s => s.trim()).filter(Boolean)))];
  const box = el('div');
  const draw = () => {
    const q = filt.q.toLowerCase();
    const items = list.filter(a =>
      (!q || a.title.toLowerCase().includes(q)) &&
      (!filt.genre || (a.genre || '').split(',').map(s => s.trim()).includes(filt.genre)) &&
      (!filt.fav || (me.favs || []).includes(a.id))
    );
    if (!items.length) {
      box.replaceChildren(el('div', {
        className: 'empty',
        textContent: list.length
          ? 'Hech narsa topilmadi.'
          : (me.role === 'admin' ? "Hali anime yo'q. «Anime qo'shish» tugmasi bilan birinchisini qo'shing." : "Hali anime qo'shilmagan.")
      }));
      return;
    }
    box.replaceChildren(el('div', { className: 'grid' }, items.map(a =>
      el('div', {
        className: 'item',
        tabIndex: 0,
        onclick: () => showDetail(a.id),
        onkeydown: (e) => e.key === 'Enter' && showDetail(a.id)
      }, poster(a), el('h3', { textContent: a.title }), el('small', { textContent: [a.genre, a.year].filter(Boolean).join(', ') }))
    )));
  };
  const favBtn = el('button', {
    textContent: 'Sevimlilar',
    className: filt.fav ? 'solid' : '',
    onclick: () => {
      filt.fav = !filt.fav;
      favBtn.classList.toggle('solid', filt.fav);
      draw();
    }
  });
  $('#app').replaceChildren(
    el('div', { className: 'tools' },
      el('input', { type: 'search', placeholder: 'Anime qidirish...', value: filt.q, oninput: (e) => { filt.q = e.target.value; draw(); } }),
      el('select', { onchange: (e) => { filt.genre = e.target.value; draw(); } },
        el('option', { value: '', textContent: 'Barcha janrlar' }),
        genres.map(x => el('option', { value: x, textContent: x, selected: x === filt.genre }))
      ),
      favBtn
    ),
    box
  );
  draw();
}

function playerFor(url) {
  const yt = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if (yt) return el('iframe', { className: 'player', src: 'https://www.youtube.com/embed/' + yt[1], allowFullscreen: true });
  return el('video', { className: 'player', src: url, controls: true });
}

async function showDetail(id) {
  try { await loadList(); } catch { return logout(); }
  const a = list.find(x => x.id === id);
  if (!a) return showList();
  const eps = a.episodes || [];
  const isAdmin = me.role === 'admin';
  const pl = el('div');
  const play = (url, btn) => {
    pl.replaceChildren(playerFor(url));
    document.querySelectorAll('.eps .ep').forEach(b => b.classList.toggle('on', b === btn));
  };

  const epBox = el('div', { className: 'eps' }, eps.map(e => {
    const b = el('button', { className: 'ep', textContent: e.title, onclick: () => play(e.video, b) });
    const w = el('span', { style: 'display:inline-flex;gap:4px' }, b);
    if (isAdmin) {
      w.append(el('button', {
        className: 'del',
        textContent: '×',
        title: "Qismni o'chirish",
        onclick: async () => {
          if (confirm("Bu qismni o'chirasizmi?")) {
            await api(`/api/anime/${id}/episodes/${e.id}`, 'DELETE');
            showDetail(id);
          }
        }
      }));
    }
    return w;
  }));

  const fav = el('button', {
    onclick: async () => {
      me.favs = (await api(`/api/anime/${id}/fav`, 'POST')).favs;
      paintFav();
    }
  });
  const paintFav = () => {
    const on = (me.favs || []).includes(id);
    fav.textContent = on ? 'Sevimlilardan olib tashlash' : "Sevimlilarga qo'shish";
    fav.classList.toggle('solid', on);
  };
  paintFav();

  const bar = el('div', { className: 'bar' }, el('button', { textContent: 'Orqaga', onclick: showList }));
  if (isAdmin) {
    bar.append(el('button', {
      className: 'del',
      textContent: "Animeni o'chirish",
      onclick: async () => {
        if (confirm("Bu animeni o'chirasizmi?")) {
          await api('/api/anime/' + id, 'DELETE');
          showList();
        }
      }
    }));
  }

  let adm = '';
  if (isAdmin) {
    const t = el('input', { placeholder: 'Qism nomi (masalan, 1-qism)', style: 'margin-top:10px' });
    const v = el('input', { placeholder: 'Video havolasi (https://...)', style: 'margin-top:10px' });
    const err = el('div', { className: 'err' });
    adm = el('div', { className: 'form sec' },
      el('h3', { textContent: "Yangi qism qo'shish" }), t, v, err,
      el('button', {
        className: 'solid',
        style: 'margin-top:10px',
        textContent: "Qism qo'shish",
        onclick: async () => {
          try {
            await api(`/api/anime/${id}/episodes`, 'POST', { title: t.value, video: v.value });
            showDetail(id);
          } catch (e) {
            err.textContent = e.message;
          }
        }
      })
    );
  }

  const cbox = el('div', { style: 'margin-top:14px' });
  const loadComments = async () => {
    const cs = await api(`/api/anime/${id}/comments`);
    cbox.replaceChildren(...(cs.length ? cs.map(c => {
      const row = el('div', { className: 'cm' },
        el('small', { textContent: c.username + ', ' + new Date(c.created).toLocaleDateString() }),
        el('div', { textContent: c.text, style: 'margin:4px 0 8px' })
      );
      if (c.username === me.username || isAdmin) {
        row.append(el('button', {
          className: 'del',
          style: 'padding:5px 12px;font-size:13px',
          textContent: "O'chirish",
          onclick: async () => {
            await api('/api/comments/' + c.id, 'DELETE');
            loadComments();
          }
        }));
      }
      return row;
    }) : [el('div', { className: 'empty', textContent: "Hali izoh yo'q. Birinchi bo'lib yozing." })]));
  };

  const ta = el('textarea', {
    rows: 3,
    maxLength: 500,
    placeholder: 'Izoh yozing...',
    style: 'width:100%;margin-top:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff'
  });
  const cerr = el('div', { className: 'err' });
  const comments = el('div', { className: 'sec' },
    el('h3', { textContent: 'Izohlar' }), ta, cerr,
    el('button', {
      className: 'solid',
      style: 'margin-top:6px',
      textContent: 'Yuborish',
      onclick: async () => {
        try {
          await api(`/api/anime/${id}/comments`, 'POST', { text: ta.value });
          ta.value = '';
          cerr.textContent = '';
          loadComments();
        } catch (e) {
          cerr.textContent = e.message;
        }
      }
    }),
    cbox
  );

  $('#app').replaceChildren(
    bar,
    el('div', { className: 'detail' },
      poster(a),
      el('div', {},
        el('h2', { textContent: a.title }),
        el('p', { textContent: [a.genre, a.year].filter(Boolean).join(', '), style: 'color:var(--mut)' }),
        el('p', { textContent: a.description }),
        fav,
        epBox,
        pl
      )
    ),
    adm,
    comments
  );

  const first = epBox.querySelector('.ep');
  if (first) first.click();
  else if (a.video) play(a.video);
  else pl.append(el('p', { className: 'empty', textContent: "Video hali qo'shilmagan." }));
  loadComments();
}

$('#logo').onclick = showList;
(async () => {
  if (token) {
    try { me = await api('/api/me'); } catch { logout(); return; }
  }
  setNav();
  showList();
})();
</script>
</body>
</html>
