<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime xona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1f8;--ink:#1b1840;--card:#fff;--mut:#6b6890;--acc:#e5486f;--line:#dcd8ec}
@media(prefers-color-scheme:dark){:root{--bg:#14122b;--ink:#efecfa;--card:#1f1c3d;--mut:#a29fc4;--acc:#ff6b8f;--line:#322e5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:800 26px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.logo b{color:var(--acc)}
nav{display:flex;gap:8px;align-items:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:10px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.del{color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:28px 5vw 60px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
.item{cursor:pointer}
.poster{aspect-ratio:2/3;border-radius:14px;background:var(--line) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;overflow:hidden}
.item h3{font-size:16px;margin:10px 0 0}
.item small{color:var(--mut)}
.form,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:520px}
.form label{display:block;font-weight:600;margin:12px 0 4px}
.form input,.form textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.err{color:var(--acc);min-height:22px;margin-top:10px}
.detail{display:grid;grid-template-columns:260px 1fr;gap:28px}
.player{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;margin-top:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.empty{color:var(--mut);padding:40px 0}
@media(max-width:700px){.detail{grid-template-columns:1fr}.poster{max-width:240px}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">Anime<b>xona</b></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('token');
let me = null;
let list = [];

const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Xatolik yuz berdi');
  return data;
};

const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => e.append(k));
  return e;
};

function setNav() {
  const nav = $('#nav'); nav.replaceChildren();
  if (me) {
    nav.append(el('span', { textContent: me.username + (me.role === 'admin' ? ' (admin)' : '') }));
    if (me.role === 'admin') nav.append(el('button', { textContent: "Anime qo'shish", onclick: showAdd }));
    nav.append(el('button', { textContent: 'Chiqish', onclick: logout }));
  } else {
    nav.append(el('button', { textContent: 'Kirish', onclick: () => showAuth('login') }));
    nav.append(el('button', { className: 'pri', textContent: "Ro'yxatdan o'tish", onclick: () => showAuth('register') }));
  }
}

function logout() { localStorage.removeItem('token'); token = null; me = null; setNav(); showList(); }

function field(label, name, type = 'text', area = false) {
  const input = area ? el('textarea', { name, rows: 4 }) : el('input', { name, type });
  return el('div', {}, el('label', { textContent: label }), input);
}

function showAuth(mode) {
  const reg = mode === 'register';
  const err = el('div', { className: 'err' });
  const form = el('div', { className: 'form' },
    el('h2', { textContent: reg ? "Ro'yxatdan o'tish" : 'Kirish' }),
    field('Login', 'username'), field('Parol', 'password', 'password'), err,
    el('button', { className: 'pri', textContent: reg ? "Akaunt yaratish" : 'Kirish', onclick: async () => {
      try {
        const d = await api(reg ? '/api/register' : '/api/login', 'POST', {
          username: form.querySelector('[name=username]').value,
          password: form.querySelector('[name=password]').value,
        });
        token = d.token; localStorage.setItem('token', token); me = d.user; setNav(); showList();
      } catch (e) { err.textContent = e.message; }
    } }),
    el('p', {}, el('button', { textContent: reg ? 'Akauntim bor' : "Akaunt yo'q", onclick: () => showAuth(reg ? 'login' : 'register') }))
  );
  $('#app').replaceChildren(form);
}

function showAdd() {
  const err = el('div', { className: 'err' });
  const form = el('div', { className: 'form' },
    el('h2', { textContent: "Yangi anime qo'shish" }),
    field('Nomi', 'title'), field('Janr', 'genre'), field('Yil', 'year', 'number'),
    field('Tavsif', 'description', 'text', true),
    field('Poster rasmi havolasi (https://...)', 'poster'),
    field('Video havolasi (mp4 yoki YouTube)', 'video'), err,
    el('button', { className: 'pri', textContent: "Qo'shish", onclick: async () => {
      const g = (n) => form.querySelector(`[name=${n}]`).value;
      try {
        await api('/api/anime', 'POST', { title: g('title'), genre: g('genre'), year: g('year'),
          description: g('description'), poster: g('poster'), video: g('video') });
        showList();
      } catch (e) { err.textContent = e.message; }
    } })
  );
  $('#app').replaceChildren(form);
}

async function showList() {
  list = await api('/api/anime');
  const app = $('#app');
  if (!list.length) {
    app.replaceChildren(el('div', { className: 'empty', textContent: me?.role === 'admin'
      ? "Hali anime yo'q. Yuqoridagi «Anime qo'shish» tugmasi bilan birinchisini qo'shing."
      : "Hali anime qo'shilmagan. Tez orada yangilari paydo bo'ladi." }));
    return;
  }
  app.replaceChildren(el('div', { className: 'grid' }, list.map(a => {
    const p = el('div', { className: 'poster' });
    if (a.poster) p.style.backgroundImage = `url("${a.poster.replace(/"/g, '%22')}")`; else p.textContent = 'Rasm yo\'q';
    return el('div', { className: 'item', tabIndex: 0, onclick: () => showDetail(a), onkeydown: (e) => e.key === 'Enter' && showDetail(a) },
      p, el('h3', { textContent: a.title }), el('small', { textContent: [a.genre, a.year].filter(Boolean).join(', ') }));
  })));
}

function playerFor(url) {
  const yt = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if (yt) return el('iframe', { className: 'player', src: 'https://www.youtube.com/embed/' + yt[1], allowFullscreen: true });
  return el('video', { className: 'player', src: url, controls: true });
}

function showDetail(a) {
  const p = el('div', { className: 'poster' });
  if (a.poster) p.style.backgroundImage = `url("${a.poster.replace(/"/g, '%22')}")`;
  const actions = el('div', { className: 'bar' }, el('button', { textContent: 'Orqaga', onclick: showList }));
  if (me?.role === 'admin') actions.append(el('button', { className: 'del', textContent: "O'chirish", onclick: async () => {
    if (confirm("Bu animeni o'chirasizmi?")) { await api('/api/anime/' + a.id, 'DELETE'); showList(); }
  } }));
  $('#app').replaceChildren(actions, el('div', { className: 'detail' }, p,
    el('div', {}, el('h2', { textContent: a.title }),
      el('p', { textContent: [a.genre, a.year].filter(Boolean).join(', '), style: 'color:var(--mut)' }),
      el('p', { textContent: a.description }),
      a.video ? playerFor(a.video) : el('p', { className: 'empty', textContent: "Video hali qo'shilmagan." }))));
}

$('#logo').onclick = showList;
(async () => {
  if (token) { try { me = await api('/api/me'); } catch { logout(); return; } }
  setNav(); showList();
})();
</script>
</body>
</html>
